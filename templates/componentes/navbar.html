{% load static %}
{%load auth_extras %}

<!-- Componente Navbar Superior (Escritorio / iPad) -->
<nav class="navbar navbar-expand-lg bg-white px-4 border-bottom fixed-top d-none d-md-block" style="height: 85px; z-index: 1020; margin-left: 80px;">
    <div class="container-fluid position-relative d-flex align-items-center justify-content-between h-100">
        
        <!-- 1. BLOQUE IZQUIERDA: Visible solo si está autenticado Y el filtro is_gestor devuelve True -->
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated and user|is_gestor %}
                <a class="nav-link text-dark fw-medium px-2 py-1 rounded hover-gestor" href="#">Panel</a>
                <a class="nav-link text-dark fw-medium px-2 py-1 rounded hover-gestor" href="#">Películas</a>
                <a class="nav-link text-dark fw-medium px-2 py-1 rounded hover-gestor" href="#">Sesiones</a>
                <a class="nav-link text-dark fw-medium px-2 py-1 rounded hover-gestor" href="#">Snack bar</a>
            {% endif %}
        </div>

        <!-- 2. BLOQUE CENTRO: Logo perfectamente centrado -->
        <a class="navbar-brand position-absolute start-50 translate-middle-x m-0 d-flex align-items-center" href="{% url 'inicio' %}" style="height: 100%;">
            <img src="{% static 'logo2.png' %}" alt="Cines León Logo" style="max-height: 70px; width: auto; object-fit: contain;">
        </a>

        <!-- 3. BLOQUE DERECHA: Nombre del usuario autenticado -->
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-2 px-3 py-1 bg-light rounded-pill border">
                    <i class="bi bi-person-fill fs-6" style="color: #720042;"></i>
                    <span class="text-dark fw-semibold small">{{ user.username }}</span>
                </div>
            {% endif %}
        </div>

    </div>
</nav>
