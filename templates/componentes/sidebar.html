{% load static %}

<!-- Barra superior exclusiva para MÓVILES (Oculta en iPad y PC con d-md-none) -->
<nav class="navbar navbar-light bg-white d-md-none px-3 shadow-sm fixed-top d-flex justify-content-between align-items-center w-100" style="height: 60px; z-index: 1040;">
    <!-- Botón hamburguesa (abre el offcanvas en móvil) -->
    <button class="navbar-toggler border-0 p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Isologo móvil -->
    <a class="navbar-brand m-0 p-0 d-flex align-items-center" href="{% url 'inicio' %}">
        <img src="{% static 'isologo.png' %}" alt="Cines León" style="height: 38px; width: auto; object-fit: contain;">
    </a>
</nav>

<!-- Menú Lateral: Sidebar fijo en Escritorio e iPad / Desplegable en Móvil -->
<div class="offcanvas-md offcanvas-start sidebar d-flex flex-column flex-shrink-0 bg-white shadow-sm border-end" tabindex="-1" id="mobileSidebar" style="z-index: 1050;">
    
    <!-- Encabezado del menú móvil -->
    <div class="offcanvas-header d-md-none border-bottom px-3 py-3">
        <h5 class="offcanvas-title fw-bold" style="color: #720042;">CINES LEÓN</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#mobileSidebar" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column p-0 w-100 h-100">
        <!-- Navegación principal -->
        <ul class="nav nav-pills flex-column mb-auto gap-2 p-2">
            <li class="nav-item">
                <a href="{% url 'inicio' %}" class="nav-link text-sidebar d-flex align-items-center py-2 px-2 rounded-3" title="Inicio">
                    <i class="bi bi-house-door fs-5 flex-shrink-0"></i>
                    <span class="ms-3 sidebar-text">Inicio</span>
                </a>
            </li>
            <li>
                <a href="{% url 'cartelera' %}" class="nav-link text-sidebar d-flex align-items-center py-2 px-2 rounded-3" title="Cartelera">
                    <i class="bi bi-film fs-5 flex-shrink-0"></i>
                    <span class="ms-3 sidebar-text">Cartelera</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link text-sidebar d-flex align-items-center py-2 px-2 rounded-3" title="snack bar">
                    <i class="bi-cup-straw fs-5 flex-shrink-0"></i>
                    <span class="ms-3 sidebar-text">Snack bar</span>
                </a>
            </li>
            <li>
                <a href="{% url 'proximos_estrenos' %}" class="nav-link text-sidebar d-flex align-items-center py-2 px-2 rounded-3" title="Próximos Estrenos">
                    <i class="bi bi-bell fs-5 flex-shrink-0"></i>
                    <span class="ms-3 sidebar-text">Próximos Estrenos</span>
                </a>
            </li>
        </ul>

        <hr class="text-muted my-2">

        <!-- Enlaces inferiores -->
        <ul class="nav nav-pills flex-column gap-2 mb-2 p-2">
            <li>
                <a href="{% url 'sobrecine' %}" class="nav-link text-sidebar d-flex align-items-center py-2 px-2 rounded-3" title="Sobre Cine">
                    <i class="bi bi-question-circle fs-5 flex-shrink-0"></i>
                    <span class="ms-3 sidebar-text">Sobre Cine</span>
                </a>
            </li>

            <!-- Control dinámico de Sesión en el Sidebar -->
            {% if user.is_authenticated %}
            <li>
                <form action="{% url 'logout' %}" method="post" class="w-100 m-0">
                    {% csrf_token %}
                    <button type="submit" class="nav-link text-sidebar w-100 text-start d-flex align-items-center py-2 px-2 rounded-3 border-0 bg-transparent" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-right fs-5 flex-shrink-0"></i>
                        <span class="ms-3 sidebar-text">Cerrar sesión</span>
                    </button>
                </form>
            </li>
            {% else %}
            <li>
                <a href="{% url 'login' %}" class="nav-link text-sidebar d-flex align-items-center py-2 px-2 rounded-3" title="Iniciar sesión">
                    <i class="bi bi-box-arrow-in-left fs-5 flex-shrink-0"></i>
                    <span class="ms-3 sidebar-text">Iniciar sesión</span>
                </a>
            </li>
            {% endif %}
        </ul>
    </div>
</div>

<style>
    /* ==========================================================
       ESCRITORIO E IPAD (Pantallas de 768px en adelante)
       ========================================================== */
    @media (min-width: 768px) {
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 80px;
            height: 100vh;
            transition: width 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
            z-index: 1030;
        }

        .sidebar:hover {
            width: 240px;
        }

        .sidebar-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-text {
            opacity: 1;
        }

        /* El contenido se desplaza a la derecha del sidebar y no tiene margen superior */
        main {
            margin-left: 100px !important;
            margin-top: 0 !important;
            transition: margin 0.3s ease;
        }
    }

    /* ==========================================================
       MÓVIL (Pantallas menores a 768px)
       ========================================================== */
    @media (max-width: 767.98px) {
        .sidebar {
            width: 260px !important;
        }

        .sidebar-text {
            opacity: 1 !important;
        }

        /* El contenido no se desplaza a la izquierda, pero baja 65px para dejar ver el navbar superior */
        main {
            margin-left: 0 !important;
            margin-top: 65px !important;
        }
    }

    /* Estilos de colores corporativos */
    .text-sidebar {
        color: #720042 !important;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-pills .text-sidebar:hover {
        background-color: #720042 !important;
        color: #ffffff !important;
    }
</style>
