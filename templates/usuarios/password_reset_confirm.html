{% extends "base.html" %}
{% load static %}
{% block titulo %}CINES LEÓN - Nueva Contraseña{% endblock %}
{% block contenido %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4 fw-bold" style="color: #720042;">Nueva contraseña</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-bold" style="color: #720042;">{{ field.label }}:</label>
                            {{ field }}
                            {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn text-white btn-lg" style="background-color: #720042;">Guardar contraseña</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<style>
    .card-body input { display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ced4da; border-radius: 0.375rem; }
</style>
{% endblock %}
