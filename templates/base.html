{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{% static 'isologo.png' %}?v=5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}CINES LEÓN{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos CSS para el Preloader -->
    <style>
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .pulse-logo {
            animation: pulse 1.5s infinite ease-in-out;
        }

        .preloader-hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Preloader con el logo principal y la carga debajo -->
    <div id="preloader" class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center bg-white" style="z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;">
        <div class="text-center">
            <!-- Logo principal -->
            <img src="{% static 'logo.png' %}" alt="Cines León" class="pulse-logo" style="height: 75px; width: auto; object-fit: contain;">
            
            <!-- Indicador de carga ubicado exactamente debajo -->
            <div class="mt-4">
                <div class="spinner-border spinner-border-sm" role="status" style="color: #720042; width: 2rem; height: 2rem;">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </div>
    </div>

    {% include "componentes/navbar.html" %}
    {% include "componentes/sidebar.html" %}

    <!-- margin-top empuja el contenido hacia abajo para que no quede debajo del navbar fijo -->
    <main class="flex-grow-1" style="margin-top: 85px;">
        {% block contenido %}
        {% endblock %}
    </main>

    {% include "componentes/footer.html" %}

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script JavaScript para el Preloader con retraso óptimo -->
    <script>
        window.addEventListener("load", function () {
            const preloader = document.getElementById("preloader");
            
            // Mantiene el preloader visible durante 800ms para apreciar la animación
            setTimeout(() => {
                preloader.classList.add("preloader-hidden");
                
                setTimeout(() => {
                    preloader.style.display = "none";
                }, 500); 
            }, 800); 
        });
    </script>
</body>

</html>
