{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{% static 'isologo.png' %}?v=5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Cines León{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    {% include "componentes/navbar.html" %}
    {% include "componentes/sidebar.html" %}

    <!-- SOLUCIÓN: margin-top empuja el contenido hacia abajo para que no quede debajo del navbar fijo -->
    <main class="flex-grow-1" style="margin-top: 85px;">
        {% block contenido %}
        {% endblock %}
    </main>

    {% include "componentes/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
