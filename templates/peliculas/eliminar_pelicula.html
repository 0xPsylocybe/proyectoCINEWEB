{% extends "base.html" %}

{% block titulo %}
CINES LEÓN - Eliminar peliculas
{% endblock %}

{% block contenido %}

<!-- Contenedor flexible que ocupa altura completa para centrar el contenido -->
<div class="d-flex flex-column justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow-sm border-0 p-4 text-center" style="max-width: 450px; width: 100%;">
        <div class="card-body">
            <h3 class="card-title text-danger mb-3 fw-bold">Eliminar Película</h3>
            
            <p class="card-text text-muted mb-4">
                ¿Desea eliminar la película <strong class="text-dark">{{ pelicula.titulo }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" class="btn btn-danger px-4">
                        Eliminar
                    </button>
                    <a href="{% url 'lista_peliculas' %}" class="btn btn-secondary px-4">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
